name: SOAP API Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 2 * * *'   # Nightly at 02:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI
    inputs:
      sheets:
        description: 'Comma-separated sheet names'
        required: false
        default: 'Sheet1'
      mode:
        description: 'Execution mode'
        required: false
        default: 'system2_only'
        type: choice
        options: [system1_only, system2_only, both_systems, system1_both_envs]
      env:
        description: 'New system environment'
        required: false
        default: 'test'
        type: choice
        options: [test, dev, uat]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run SOAP API tests
        env:
          # Secrets for endpoint URLs / credentials — set these in GitHub repo Settings → Secrets
          SOAP_ENDPOINT_URL: ${{ secrets.SOAP_ENDPOINT_URL }}
          SOAP_ENDPOINT_URL_NEW: ${{ secrets.SOAP_ENDPOINT_URL_NEW }}
        run: |
          python run_tests.py \
            --excel "${{ vars.TEST_EXCEL_FILE || 'tests/test_cases.xlsx' }}" \
            --sheets "${{ github.event.inputs.sheets || vars.TEST_SHEETS || 'Sheet1' }}" \
            --mode "${{ github.event.inputs.mode || vars.EXECUTION_MODE || 'system2_only' }}" \
            --new-env "${{ github.event.inputs.env || vars.NEW_TARGET_ENV || 'test' }}" \
            --assert-error-text \
            --parallel

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()   # upload even when tests fail
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Generate & publish Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
